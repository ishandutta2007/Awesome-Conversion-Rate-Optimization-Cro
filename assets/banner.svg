<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-a" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="bar-b" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .stat-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #10b981;
      }
      .muted-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
      }

      /* Animated SVG Elements */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes growHeight {
        0%, 100% { height: 110px; y: 190px; }
        50% { height: 130px; y: 170px; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 5px; opacity: 0.8; }
        50% { r: 8px; opacity: 1; }
      }

      .glow-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1000px 300px;
        animation: pulseGlow 9s ease-in-out infinite alternate;
      }
      .floating-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatOpposite 6s ease-in-out infinite;
      }
      .animated-bar {
        animation: growHeight 4s ease-in-out infinite;
      }
      .ping-dot {
        animation: pulseDot 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="220" cy="120" r="220" fill="url(#glow-cyan)" />
  <circle class="glow-orb-2" cx="980" cy="280" r="240" fill="url(#glow-purple)" />
  <circle cx="650" cy="380" r="160" fill="url(#glow-emerald)" opacity="0.4" />

  <!-- Dynamic / Animated Illustration Component (A/B Experimentation & Analytics Dashboard Card) -->
  <g class="floating-card-1" transform="translate(810, 50)">
    <!-- Main Glassmorphic Card -->
    <rect width="330" height="310" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header of Mockup Card -->
    <circle cx="28" cy="26" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="26" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="26" r="5" fill="#10b981" opacity="0.8" />
    <text x="85" y="30" class="muted-label">EXPERIMENT #104: CHECKOUT FLOW</text>

    <!-- Variant Comparison Container -->
    <!-- Variant A (Control) -->
    <rect x="25" y="55" width="130" height="150" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="40" y="78" class="pill-text" fill="#94a3b8">Control (A)</text>
    <rect x="65" y="120" width="45" height="65" rx="4" fill="url(#bar-a)" />
    <text x="67" y="112" class="muted-label">3.2%</text>

    <!-- Variant B (Variant / Winner) -->
    <rect x="175" y="55" width="130" height="150" rx="10" fill="#0f172a" stroke="#0369a1" stroke-width="1.2" />
    <text x="190" y="78" class="pill-text" fill="#38bdf8">Variation (B)</text>
    <!-- Dynamic Animated Bar for Variation B -->
    <rect class="animated-bar" x="215" y="90" width="45" height="95" rx="4" fill="url(#bar-b)" />
    <text x="218" y="82" class="stat-text">+38.4%</text>

    <!-- Mini Funnel Line / Uplift Indicator -->
    <rect x="25" y="222" width="280" height="65" rx="10" fill="#0f172a" stroke="#1e293b" />
    <circle cx="48" cy="254" r="6" fill="#10b981" class="ping-dot" />
    <text x="64" y="248" class="pill-text" fill="#f8fafc">Statistical Significance: 99.4%</text>
    <text x="64" y="268" class="stat-text">P-Value &lt; 0.001 • Winner Declared</text>
  </g>

  <!-- Secondary Dynamic Floating Pill / Tag Card -->
  <g class="floating-card-2" transform="translate(730, 280)">
    <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="26" class="pill-text">100% Data Sovereignty</text>
  </g>

  <!-- Foreground Main Title & Content (Ensured unobstructed foreground) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill -->
    <rect width="265" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <text x="18" y="21" class="tag-text">⚡ CURATED CRO ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text" fill="url(#text-grad)">Awesome CRO</text>
    <text x="340" y="85" class="title-text" fill="#f8fafc">&amp; Experimentation</text>

    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle-text">The definitive guide to Conversion Rate Optimization,</text>
    <text x="0" y="160" class="subtitle-text">A/B testing, session replay, and behavior-driven growth engines.</text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: A/B Testing -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🧪 A/B &amp; MVT Testing</text>
      </g>
      <!-- Pill 2: Session Replay -->
      <g transform="translate(145, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="pill-text">📼 Session Replay</text>
      </g>
      <!-- Pill 3: Heatmaps -->
      <g transform="translate(300, 0)">
        <rect width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🔥 Heatmaps</text>
      </g>
      <!-- Pill 4: Open-Source -->
      <g transform="translate(425, 0)">
        <rect width="170" height="34" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
        <text x="14" y="22" class="pill-text" fill="#6ee7b7">⭐ Open-Source &amp; SaaS</text>
      </g>
    </g>

    <!-- Meta / Callout line -->
    <text x="2" y="265" class="muted-label" fill="#94a3b8">Warehouse-Native • Bayesian &amp; Frequentist Statistics • Privacy-First Analytics</text>
  </g>
</svg>