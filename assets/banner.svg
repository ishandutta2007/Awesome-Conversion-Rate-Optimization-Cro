nsform:translateY(0)}50%{transform:translateY(6px)}}@keyframes growHeight{0%{height:110px;y:190px}50%{height:130px;y:170px}}@keyframes pulseDot{0%{r:5px;opacity:.8}50%{r:8px;opacity:1}}.muted-label,.pill-text,.stat-text,.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.pill-text,.tag-text{font-weight:600}.tag-text{font-size:13px;fill:#38bdf8}.pill-text{font-size:12px;fill:#e2e8f0}.stat-text{font-weight:700;font-size:14px;fill:#10b981}.muted-label{font-weight:500;font-size:11px;fill:#64748b}.glow-orb-1{transform-origin:200px 100px;animation:pulseGlow 7s ease-in-out infinite}.glow-orb-2{transform-origin:1000px 300px;animation:pulseGlow 9s ease-in-out infinite alternate}.floating-card-1{animation:floatSlow 5s ease-in-out infinite}.floating-card-2{animation:floatOpposite 6s ease-in-out infinite}.animated-bar{animation:growHeight 4s ease-in-out infinite}.ping-dot{animation:pulseDot 2s ease-in-out infinite}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="220" cy="120" r="220" fill="url(#glow-cyan)" class="glow-orb-1"/><circle cx="980" cy="280" r="240" fill="url(#glow-purple)" class="glow-orb-2"/><circle cx="650" cy="380" r="160" fill="url(#glow-emerald)" opacity=".4"/><g class="floating-card-1" transform="translate(810, 50)"><rect width="330" height="310" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="28" cy="26" r="5" fill="#ef4444" opacity=".8"/><circle cx="44" cy="26" r="5" fill="#f59e0b" opacity=".8"/><circle cx="60" cy="26" r="5" fill="#10b981" opacity=".8"/><text x="85" y="30" class="muted-label">EXPERIMENT #104: CHECKOUT FLOW</text><rect width="130" height="150" x="25" y="55" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="